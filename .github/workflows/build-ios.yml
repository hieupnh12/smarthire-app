name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - hieunm
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-ios:
    name: Build iOS Release IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (Release, Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package IPA Archive
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r smarthire.ipa Payload
          ls -lh smarthire.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarthire-ios-ipa
          path: build/ios/ipa/smarthire.ipa
          retention-days: 14

